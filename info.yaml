# Tiny Tapeout project information
project:
  title:        "Scalable TinyML NPU 1x1 (ECG & CNN/MLP)"
  author:       "Thinh Pham"
  discord:      ""
  description:  "Scalable 1x1 tile TinyML NPU accelerator for ECG arrhythmia classification"
  language:     "Verilog"
  clock_hz:     50000000  # 50 MHz

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tinyml_npu_1x1"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  source_files:
    - "tt_um_tinyml_npu_1x1.v"
    - "npu_top.v"
    - "npu_array.v"
    - "npu_pe.v"
    - "npu_controller.v"
    - "npu_activation.v"
    - "npu_argmax.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Outputs
  uo[0]: "data_out[0] / class[0]"
  uo[1]: "data_out[1] / class[1]"
  uo[2]: "data_out[2] / class[2]"
  uo[3]: "data_out[3] / class[3]"
  uo[4]: "data_out[4] / layer_done"
  uo[5]: "data_out[5] / out_valid"
  uo[6]: "data_out[6] / npu_busy"
  uo[7]: "data_out[7] / overflow"

  # Bidirectional pins
  uio[0]: "host_valid"
  uio[1]: "npu_ready"
  uio[2]: "cmd_mode"
  uio[3]: "weight_stream"
  uio[4]: "out_sel"
  uio[5]: "out_valid"
  uio[6]: "layer_done"
  uio[7]: "npu_busy"

# Do not change!
yaml_version: 6
