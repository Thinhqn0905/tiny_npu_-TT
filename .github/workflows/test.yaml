name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install front-end tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys opensta

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run front-end RTL tests
        run: |
          make preflight lint tb-compile arithmetic release existing legacy standalone generate-network-test sva-compile contract-shell-compile trained-network

      - name: Test Summary
        uses: test-summary/action@v2.3
        with:
          paths: "evidence/review/final/*.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            evidence/review/final/*.xml
            evidence/review/final/*.log
